<svg width="550" height="400" viewBox="0 0 550 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="550" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="275" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Архитектура Graphics</text>
  
  <!-- Main Graphics Box -->
  <rect x="150" y="50" width="250" height="60" rx="8" fill="#0078d4" stroke="#005a9e" stroke-width="3"/>
  <text x="275" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Graphics</text>
  <text x="275" y="95" font-family="Arial, sans-serif" font-size="10" fill="#e6f2ff" text-anchor="middle">главный объект рисования</text>
  
  <!-- Arrows pointing down -->
  <line x1="275" y1="110" x2="275" y2="130" stroke="#333" stroke-width="2"/>
  <polygon points="275,130 270,125 280,125" fill="#333"/>
  
  <!-- Helper Objects Box -->
  <rect x="50" y="140" width="450" height="220" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="275" y="165" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Использует эти вспомогательные объекты:</text>
  
  <!-- Pen -->
  <rect x="70" y="180" width="200" height="40" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="170" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#856404">Pen</text>
  <text x="170" y="214" font-family="Arial, sans-serif" font-size="9" fill="#666">Рисует контуры (outline)</text>
  
  <!-- Brush -->
  <rect x="280" y="180" width="200" height="40" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="380" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155724">Brush</text>
  <text x="380" y="214" font-family="Arial, sans-serif" font-size="9" fill="#666">Заполняет области (fill)</text>
  
  <!-- Font -->
  <rect x="70" y="230" width="200" height="40" rx="4" fill="#e7f3ff" stroke="#0078d4" stroke-width="1"/>
  <text x="170" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#004085">Font</text>
  <text x="170" y="264" font-family="Arial, sans-serif" font-size="9" fill="#666">Стиль текста</text>
  
  <!-- Color -->
  <rect x="280" y="230" width="200" height="40" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="380" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#721c24">Color</text>
  <text x="380" y="264" font-family="Arial, sans-serif" font-size="9" fill="#666">Работа с цветом (RGB, ARGB)</text>
  
  <!-- Image/Bitmap -->
  <rect x="70" y="280" width="200" height="40" rx="4" fill="#e2e3e5" stroke="#6c757d" stroke-width="1"/>
  <text x="170" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#383d41">Image/Bitmap</text>
  <text x="170" y="314" font-family="Arial, sans-serif" font-size="9" fill="#666">Работа с изображениями</text>
  
  <!-- Properties -->
  <rect x="280" y="280" width="200" height="40" rx="4" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1"/>
  <text x="380" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0c5460">Properties</text>
  <text x="380" y="314" font-family="Arial, sans-serif" font-size="9" fill="#666">Свойства объектов</text>
  
  <!-- Note -->
  <rect x="50" y="370" width="450" height="20" rx="4" fill="#cce5ff" stroke="#007bff" stroke-width="1"/>
  <text x="275" y="383" font-family="Arial, sans-serif" font-size="9" fill="#004085" text-anchor="middle">💡 Graphics использует вспомогательные объекты для рисования</text>
</svg>