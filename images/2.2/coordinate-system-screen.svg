<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Система координат экрана</text>
  
  <!-- Form Window -->
  <rect x="50" y="50" width="500" height="300" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Form Title Bar -->
  <rect x="50" y="50" width="500" height="25" rx="4" fill="#0078d4"/>
  <text x="300" y="67" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Form1</text>
  
  <!-- Origin Label -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="12" fill="#dc3545" font-weight="bold">(0,0)</text>
  
  <!-- Client Area -->
  <rect x="65" y="85" width="470" height="250" rx="2" fill="#f0f8ff" stroke="#0078d4" stroke-width="1"/>
  <text x="300" y="105" font-family="Arial, sans-serif" font-size="10" fill="#0078d4" text-anchor="middle">Клиентская область (Client Area)</text>
  
  <!-- Point at (100, 100) -->
  <circle cx="165" cy="185" r="5" fill="#dc3545"/>
  <text x="175" y="190" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" font-weight="bold">(100, 100)</text>
  
  <!-- Point at (800, 600) -->
  <circle cx="515" cy="305" r="5" fill="#28a745"/>
  <text x="445" y="300" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">(800, 600)</text>
  
  <!-- X Axis -->
  <line x1="65" y1="330" x2="535" y2="330" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="545" y="335" font-family="Arial, sans-serif" font-size="14" fill="#007bff" font-weight="bold">X →</text>
  
  <!-- Y Axis -->
  <line x1="65" y1="85" x2="65" y2="330" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="55" y="80" font-family="Arial, sans-serif" font-size="14" fill="#007bff" font-weight="bold">↓ Y</text>
  
  <!-- Corner Labels -->
  <text x="75" y="345" font-family="Arial, sans-serif" font-size="9" fill="#666">(0, Height-1)</text>
  <text x="470" y="80" font-family="Arial, sans-serif" font-size="9" fill="#666">(Width-1, 0)</text>
  <text x="470" y="345" font-family="Arial, sans-serif" font-size="9" fill="#666">(Width-1, Height-1)</text>
  
  <!-- Note -->
  <rect x="50" y="360" width="500" height="30" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">💡 Y растет ВНИЗ (в отличие от школьной математики!)</text>
  <text x="300" y="387" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">X растет вправо, Y растет вниз, (0,0) — левый верхний угол</text>
</svg>