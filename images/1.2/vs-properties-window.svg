<svg width="550" height="350" viewBox="0 0 550 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="550" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="275" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Окно Properties в Visual Studio</text>
  
  <!-- Properties Window -->
  <rect x="50" y="35" width="450" height="280" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Window Title Bar -->
  <rect x="50" y="35" width="450" height="25" rx="4" fill="#0078d4"/>
  <text x="275" y="52" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Button Properties</text>
  
  <!-- Tabs -->
  <rect x="50" y="60" width="225" height="22" fill="#e5e5e5" stroke="#ccc" stroke-width="0.5"/>
  <text x="162" y="75" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">Properties</text>
  
  <rect x="275" y="60" width="225" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>
  <text x="387" y="75" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Events</text>
  
  <!-- Properties List -->
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="11" fill="#333">(Name)</text>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666">button1</text>
  
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#333">▼ Layout</text>
  
  <text x="85" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">Anchor</text>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">Top, Left</text>
  
  <text x="85" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666">Dock</text>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666">None</text>
  
  <text x="85" y="185" font-family="Arial, sans-serif" font-size="10" fill="#666">Location</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="10" fill="#0078d4" font-weight="bold">100, 100</text>
  <text x="480" y="185" font-family="Arial, sans-serif" font-size="9" fill="#999">← X,Y</text>
  
  <text x="85" y="205" font-family="Arial, sans-serif" font-size="10" fill="#666">Margin</text>
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="10" fill="#666">3, 3, 3, 3</text>
  
  <text x="85" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">Padding</text>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">0, 0, 0, 0</text>
  
  <text x="85" y="245" font-family="Arial, sans-serif" font-size="10" fill="#666">Size</text>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="10" fill="#0078d4" font-weight="bold">75, 23</text>
  <text x="480" y="245" font-family="Arial, sans-serif" font-size="9" fill="#999">← W,H</text>
  
  <text x="85" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666">TabIndex</text>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  
  <text x="85" y="285" font-family="Arial, sans-serif" font-size="10" fill="#666">TabStop</text>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="10" fill="#666">True</text>
  
  <!-- Divider -->
  <line x1="350" y1="95" x2="350" y2="295" stroke="#ddd" stroke-width="1"/>
  
  <!-- Note -->
  <rect x="50" y="325" width="450" height="20" rx="2" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="275" y="338" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">Location = Point {X, Y}, Size = Size {Width, Height}</text>
</svg>