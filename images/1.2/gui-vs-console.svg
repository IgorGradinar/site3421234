<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">GUI vs Консоль</text>
  
  <!-- Console Section -->
  <rect x="50" y="50" width="220" height="120" rx="8" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  <text x="160" y="75" font-family="Arial, sans-serif" font-size="14" fill="#00ff00" text-anchor="middle">КОНСОЛЬ</text>
  <text x="160" y="95" font-family="Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="middle">(старинный способ)</text>
  <text x="70" y="120" font-family="Courier New, monospace" font-size="12" fill="#ffffff">C:\> Введите число: _</text>
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">Запомнить команды!</text>
  
  <!-- GUI Section -->
  <rect x="330" y="50" width="220" height="120" rx="8" fill="#ffffff" stroke="#00A4EF" stroke-width="2"/>
  <text x="440" y="75" font-family="Arial, sans-serif" font-size="14" fill="#00A4EF" text-anchor="middle">GUI</text>
  <text x="440" y="95" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">(современный способ)</text>
  
  <!-- Input Box -->
  <rect x="360" y="110" width="160" height="30" rx="4" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <text x="370" y="130" font-family="Arial, sans-serif" font-size="11" fill="#333333">Введите число:</text>
  
  <!-- Buttons -->
  <rect x="360" y="145" width="75" height="20" rx="4" fill="#00A4EF"/>
  <text x="397" y="159" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">OK</text>
  <rect x="445" y="145" width="75" height="20" rx="4" fill="#cccccc"/>
  <text x="482" y="159" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Отмена</text>
  
  <!-- Arrow -->
  <line x1="280" y1="110" x2="320" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Benefits -->
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Преимущества GUI:</text>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Интуитивно понятно</text>
  <text x="100" y="255" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Визуальная обратная связь</text>
  <text x="100" y="275" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Красивые приложения</text>
  <text x="350" y="235" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Интерактивность</text>
  <text x="350" y="255" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Много элементов</text>
  <text x="350" y="275" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Быстрое обучение</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>