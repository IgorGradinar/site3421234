<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Сравнение: Растровая vs Векторная графика</text>
  
  <!-- Table Header -->
  <rect x="50" y="50" width="200" height="35" fill="#68217A"/>
  <text x="150" y="73" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">Характеристика</text>
  
  <rect x="250" y="50" width="200" height="35" fill="#F25022"/>
  <text x="350" y="73" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">Растровая</text>
  
  <rect x="450" y="50" width="200" height="35" fill="#00A4EF"/>
  <text x="550" y="73" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">Векторная</text>
  
  <!-- Row 1: Структура -->
  <rect x="50" y="85" width="200" height="35" fill="#ffffff" stroke="#cccccc"/>
  <text x="150" y="108" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Структура</text>
  
  <rect x="250" y="85" width="200" height="35" fill="#fff5f5" stroke="#cccccc"/>
  <text x="350" y="108" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Сетка пикселей</text>
  
  <rect x="450" y="85" width="200" height="35" fill="#f0f8ff" stroke="#cccccc"/>
  <text x="550" y="108" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Математические формулы</text>
  
  <!-- Row 2: Масштабирование -->
  <rect x="50" y="120" width="200" height="35" fill="#ffffff" stroke="#cccccc"/>
  <text x="150" y="143" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Масштабирование</text>
  
  <rect x="250" y="120" width="200" height="35" fill="#fff5f5" stroke="#cccccc"/>
  <text x="350" y="143" font-family="Arial, sans-serif" font-size="18" fill="#dc3545" text-anchor="middle">❌</text>
  
  <rect x="450" y="120" width="200" height="35" fill="#f0f8ff" stroke="#cccccc"/>
  <text x="550" y="143" font-family="Arial, sans-serif" font-size="18" fill="#28a745" text-anchor="middle">✅</text>
  
  <!-- Row 3: Размер файла -->
  <rect x="50" y="155" width="200" height="35" fill="#ffffff" stroke="#cccccc"/>
  <text x="150" y="178" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Размер файла</text>
  
  <rect x="250" y="155" width="200" height="35" fill="#fff5f5" stroke="#cccccc"/>
  <text x="350" y="178" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Большой</text>
  
  <rect x="450" y="155" width="200" height="35" fill="#f0f8ff" stroke="#cccccc"/>
  <text x="550" y="178" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Маленький</text>
  
  <!-- Row 4: Редактирование -->
  <rect x="50" y="190" width="200" height="35" fill="#ffffff" stroke="#cccccc"/>
  <text x="150" y="213" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Редактирование</text>
  
  <rect x="250" y="190" width="200" height="35" fill="#fff5f5" stroke="#cccccc"/>
  <text x="350" y="213" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Сложное</text>
  
  <rect x="450" y="190" width="200" height="35" fill="#f0f8ff" stroke="#cccccc"/>
  <text x="550" y="213" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Простое</text>
  
  <!-- Row 5: Фотографии -->
  <rect x="50" y="225" width="200" height="35" fill="#ffffff" stroke="#cccccc"/>
  <text x="150" y="248" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Фотографии</text>
  
  <rect x="250" y="225" width="200" height="35" fill="#fff5f5" stroke="#cccccc"/>
  <text x="350" y="248" font-family="Arial, sans-serif" font-size="18" fill="#28a745" text-anchor="middle">✅</text>
  
  <rect x="450" y="225" width="200" height="35" fill="#f0f8ff" stroke="#cccccc"/>
  <text x="550" y="248" font-family="Arial, sans-serif" font-size="18" fill="#dc3545" text-anchor="middle">❌</text>
  
  <!-- Row 6: Логотипы -->
  <rect x="50" y="260" width="200" height="35" fill="#ffffff" stroke="#cccccc"/>
  <text x="150" y="283" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Логотипы</text>
  
  <rect x="250" y="260" width="200" height="35" fill="#fff5f5" stroke="#cccccc"/>
  <text x="350" y="283" font-family="Arial, sans-serif" font-size="18" fill="#dc3545" text-anchor="middle">❌</text>
  
  <rect x="450" y="260" width="200" height="35" fill="#f0f8ff" stroke="#cccccc"/>
  <text x="550" y="283" font-family="Arial, sans-serif" font-size="18" fill="#28a745" text-anchor="middle">✅</text>
  
  <!-- Legend -->
  <text x="150" y="320" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">✅ Идеально</text>
  <text x="150" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">❌ Плохо</text>
</svg>