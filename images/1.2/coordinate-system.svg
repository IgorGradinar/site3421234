<svg width="650" height="400" viewBox="0 0 650 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="650" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="325" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Система координат в графике</text>
  
  <!-- Coordinate System Box -->
  <rect x="50" y="50" width="550" height="280" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- (0,0) Label -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="12" fill="#dc3545" font-weight="bold">(0,0) — левый верхний угол</text>
  
  <!-- X Axis -->
  <line x1="70" y1="310" x2="580" y2="310" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="590" y="315" font-family="Arial, sans-serif" font-size="14" fill="#007bff" font-weight="bold">X →</text>
  
  <!-- Y Axis -->
  <line x1="70" y1="80" x2="70" y2="310" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="14" fill="#007bff" font-weight="bold">↓ Y</text>
  
  <!-- Client Area Rectangle -->
  <rect x="150" y="100" width="400" height="150" rx="4" fill="#e7f3ff" stroke="#007bff" stroke-width="2"/>
  <text x="350" y="125" font-family="Arial, sans-serif" font-size="14" fill="#007bff" font-weight="bold" text-anchor="middle">Клиентская область</text>
  
  <!-- Point (100, 50) -->
  <circle cx="250" cy="150" r="5" fill="#dc3545"/>
  <text x="260" y="155" font-family="Arial, sans-serif" font-size="11" fill="#dc3545" font-weight="bold">(100, 50)</text>
  
  <!-- Point (400, 300) -->
  <circle cx="550" cy="300" r="5" fill="#28a745"/>
  <text x="500" y="295" font-family="Arial, sans-serif" font-size="11" fill="#28a745" font-weight="bold">(400, 300)</text>
  
  <!-- Corner Labels -->
  <text x="80" y="325" font-family="Arial, sans-serif" font-size="10" fill="#666">(0, высота-1)</text>
  <text x="500" y="95" font-family="Arial, sans-serif" font-size="10" fill="#666">(ширина-1, 0)</text>
  <text x="500" y="325" font-family="Arial, sans-serif" font-size="10" fill="#666">(ширина-1, высота-1)</text>
  
  <!-- Examples Box -->
  <rect x="50" y="340" width="550" height="50" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="325" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Примеры (экран 800x600):</text>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="11" fill="#333">Левый верхний: (0,0)</text>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="11" fill="#333">Правый нижний: (799,599)</text>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="11" fill="#333">Центр: (400, 300)</text>
  
  <!-- Warning -->
  <text x="325" y="395" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" text-anchor="middle">⚠️ Y возрастает ВНИЗ (в отличие от школьной математики!)</text>
</svg>