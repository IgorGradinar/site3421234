<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="250" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Координаты компонента относительно формы</text>
  
  <!-- Form -->
  <rect x="50" y="40" width="400" height="280" rx="4" fill="#ffffff" stroke="#0078d4" stroke-width="3"/>
  
  <!-- Form Title Bar -->
  <rect x="50" y="40" width="400" height="25" rx="4" fill="#0078d4"/>
  <text x="250" y="57" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Форма (0,0)</text>
  
  <!-- Origin Label -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" font-weight="bold">(0,0)</text>
  
  <!-- Client Area -->
  <rect x="65" y="85" width="370" height="220" rx="2" fill="#f0f8ff" stroke="#0078d4" stroke-width="1"/>
  <text x="250" y="105" font-family="Arial, sans-serif" font-size="10" fill="#0078d4" text-anchor="middle">Клиентская область</text>
  
  <!-- Button -->
  <rect x="150" y="130" width="75" height="23" rx="2" fill="#e7f3ff" stroke="#0078d4" stroke-width="2"/>
  <text x="187" y="145" font-family="Arial, sans-serif" font-size="9" fill="#0078d4" text-anchor="middle">Button1</text>
  
  <!-- Button Location -->
  <line x1="150" y1="130" x2="65" y2="85" stroke="#dc3545" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="110" font-family="Arial, sans-serif" font-size="9" fill="#dc3545" font-weight="bold">Location: 100, 100</text>
  
  <!-- Button Size -->
  <line x1="225" y1="153" x2="225" y2="200" stroke="#28a745" stroke-width="1"/>
  <text x="230" y="180" font-family="Arial, sans-serif" font-size="9" fill="#28a745">Size: 75, 23</text>
  
  <!-- Corner Labels -->
  <text x="160" y="125" font-family="Arial, sans-serif" font-size="8" fill="#666">↑ Top</text>
  <text x="230" y="145" font-family="Arial, sans-serif" font-size="8" fill="#666">Right →</text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="8" fill="#666">↓ Bottom</text>
  <text x="145" y="145" font-family="Arial, sans-serif" font-size="8" fill="#666">← Left</text>
  
  <!-- Bottom Right Corner -->
  <text x="320" y="300" font-family="Arial, sans-serif" font-size="9" fill="#666">(435, 305)</text>
  
  <!-- Calculations Box -->
  <rect x="50" y="325" width="400" height="20" rx="2" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="250" y="338" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">Left: Location.X, Right: Location.X + Width, Top: Location.Y, Bottom: Location.Y + Height</text>
</svg>