<svg width="650" height="300" viewBox="0 0 650 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="650" height="300" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="325" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Растровая графика</text>
  
  <!-- Original Image -->
  <rect x="50" y="50" width="150" height="100" rx="4" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <text x="125" y="105" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Исходное</text>
  <text x="125" y="120" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">(прямоугольник)</text>
  
  <!-- Arrow -->
  <line x1="220" y1="100" x2="260" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="90" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">→</text>
  
  <!-- Raster Representation -->
  <rect x="280" y="50" width="320" height="100" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="440" y="75" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Растровое представление (сетка пикселей)</text>
  
  <!-- Pixel Grid -->
  <g transform="translate(320, 90)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="30" y="0" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="60" y="0" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="90" y="0" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="120" y="0" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    
    <!-- Row 2 -->
    <rect x="0" y="15" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="30" y="15" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="60" y="15" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="90" y="15" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="120" y="15" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    
    <!-- Row 3 -->
    <rect x="0" y="30" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="30" y="30" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="60" y="30" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="90" y="30" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
    <rect x="120" y="30" width="30" height="15" fill="#FFD700" stroke="#cccccc" stroke-width="0.5"/>
  </g>
  
  <!-- Pixel Legend -->
  <text x="325" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Каждый квадратик = пиксель с цветом</text>
  
  <!-- Color Box -->
  <rect x="260" y="190" width="130" height="30" rx="4" fill="#FFD700" stroke="#333" stroke-width="1"/>
  <text x="325" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">RGB: 255, 255, 0 (желтый)</text>
  
  <!-- Characteristics -->
  <text x="325" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Характеристики:</text>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="10" fill="#666">• Сетка пикселей</text>
  <text x="280" y="270" font-family="Arial, sans-serif" font-size="10" fill="#666">• Теряет качество при масштабировании</text>
  <text x="450" y="270" font-family="Arial, sans-serif" font-size="10" fill="#666">• Большой размер файла</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>