<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">RGB комбинации цветов</text>
  
  <!-- Main Grid -->
  <rect x="25" y="50" width="550" height="320" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Primary Colors -->
  <text x="300" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Основные цвета (Primary Colors)</text>
  
  <!-- Red -->
  <rect x="50" y="90" width="100" height="60" rx="4" fill="#ff0000" stroke="#333" stroke-width="1"/>
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Красный</text>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">(255,0,0)</text>
  
  <!-- Green -->
  <rect x="170" y="90" width="100" height="60" rx="4" fill="#00ff00" stroke="#333" stroke-width="1"/>
  <text x="220" y="125" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Зеленый</text>
  <text x="220" y="140" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle">(0,255,0)</text>
  
  <!-- Blue -->
  <rect x="290" y="90" width="100" height="60" rx="4" fill="#0000ff" stroke="#333" stroke-width="1"/>
  <text x="340" y="125" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Синий</text>
  <text x="340" y="140" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">(0,0,255)</text>
  
  <!-- Secondary Colors -->
  <text x="300" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Смешанные цвета (Secondary Colors)</text>
  
  <!-- Yellow -->
  <rect x="50" y="190" width="100" height="60" rx="4" fill="#ffff00" stroke="#333" stroke-width="1"/>
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Желтый</text>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle">(255,255,0)</text>
  
  <!-- Magenta -->
  <rect x="170" y="190" width="100" height="60" rx="4" fill="#ff00ff" stroke="#333" stroke-width="1"/>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Пурпурный</text>
  <text x="220" y="240" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">(255,0,255)</text>
  
  <!-- Cyan -->
  <rect x="290" y="190" width="100" height="60" rx="4" fill="#00ffff" stroke="#333" stroke-width="1"/>
  <text x="340" y="225" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Голубой</text>
  <text x="340" y="240" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle">(0,255,255)</text>
  
  <!-- Extremes -->
  <text x="300" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Крайние значения</text>
  
  <!-- White -->
  <rect x="50" y="290" width="100" height="60" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="100" y="325" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Белый</text>
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle">(255,255,255)</text>
  
  <!-- Black -->
  <rect x="170" y="290" width="100" height="60" rx="4" fill="#000000" stroke="#333" stroke-width="1"/>
  <text x="220" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Черный</text>
  <text x="220" y="340" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">(0,0,0)</text>
  
  <!-- Gray -->
  <rect x="290" y="290" width="100" height="60" rx="4" fill="#808080" stroke="#333" stroke-width="1"/>
  <text x="340" y="325" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Серый</text>
  <text x="340" y="340" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">(128,128,128)</text>
  
  <!-- Note -->
  <rect x="410" y="90" width="155" height="260" rx="4" fill="#cce5ff" stroke="#007bff" stroke-width="1"/>
  <text x="487" y="110" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#004085" text-anchor="middle">Правило смешивания:</text>
  
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="9" fill="#004085">• Каждый компонент (R,G,B)</text>
  <text x="420" y="145" font-family="Arial, sans-serif" font-size="9" fill="#004085">  от 0 до 255</text>
  
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="9" fill="#004085">• 0 = отсутствие цвета</text>
  <text x="420" y="180" font-family="Arial, sans-serif" font-size="9" fill="#004085">• 255 = максимум</text>
  
  <text x="420" y="200" font-family="Arial, sans-serif" font-size="9" fill="#004085">Примеры:</text>
  <text x="420" y="215" font-family="Arial, sans-serif" font-size="9" fill="#004085">R(255),G(0),B(0) = Красный</text>
  <text x="420" y="230" font-family="Arial, sans-serif" font-size="9" fill="#004085">R(255),G(255),B(0) = Желтый</text>
  <text x="420" y="245" font-family="Arial, sans-serif" font-size="9" fill="#004085">R(255),G(255),B(255)= Белый</text>
  
  <text x="420" y="265" font-family="Arial, sans-serif" font-size="9" fill="#004085">Смешивание:</text>
  <text x="420" y="280" font-family="Arial, sans-serif" font-size="9" fill="#004085">Красный + Зеленый = Желтый</text>
  <text x="420" y="295" font-family="Arial, sans-serif" font-size="9" fill="#004085">Красный + Синий = Пурпур</text>
  <text x="420" y="310" font-family="Arial, sans-serif" font-size="9" fill="#004085">Зеленый + Синий = Голубой</text>
  <text x="420" y="325" font-family="Arial, sans-serif" font-size="9" fill="#004085">Все три = Белый</text>
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="9" fill="#004085">Ничего = Черный</text>
</svg>