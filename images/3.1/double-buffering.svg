<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Двойная буферизация (Double Buffering)</text>
  
  <!-- Without Buffering -->
  <rect x="25" y="40" width="270" height="340" rx="8" fill="#fff5f5" stroke="#dc3545" stroke-width="2"/>
  <text x="160" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545" text-anchor="middle">БЕЗ БУФЕРИЗАЦИИ</text>
  
  <text x="40" y="90" font-family="Arial, sans-serif" font-size="10" fill="#333">Прямое рисование на экран:</text>
  
  <!-- Frames -->
  <rect x="35" y="100" width="250" height="30" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="160" y="120" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">0ms: Очистка экрана ❌</text>
  
  <rect x="35" y="135" width="250" height="30" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="160" y="155" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">1ms: Объект 1 ❌</text>
  
  <rect x="35" y="170" width="250" height="30" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="160" y="190" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">2ms: Объект 2 ❌</text>
  
  <rect x="35" y="205" width="250" height="30" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="160" y="225" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">...</text>
  
  <rect x="35" y="240" width="250" height="30" rx="2" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="160" y="260" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">10ms: Объект 10 ✅</text>
  
  <!-- Result -->
  <rect x="35" y="280" width="250" height="40" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="160" y="300" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc3545" text-anchor="middle">РЕЗУЛЬТАТ:</text>
  <text x="160" y="314" font-family="Arial, sans-serif" font-size="9" fill="#dc3545" text-anchor="middle">Мерцание на протяжении 10ms!</text>
  
  <!-- With Buffering -->
  <rect x="305" y="40" width="270" height="340" rx="8" fill="#f0fff4" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745" text-anchor="middle">ДВОЙНАЯ БУФЕРИЗАЦИЯ</text>
  
  <text x="320" y="90" font-family="Arial, sans-serif" font-size="10" fill="#333">Рисование в памяти → копирование:</text>
  
  <!-- Frames -->
  <rect x="315" y="100" width="250" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="120" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">0ms: В памяти очистка</text>
  
  <rect x="315" y="135" width="250" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">1ms: В памяти объект 1</text>
  
  <rect x="315" y="170" width="250" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="190" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">2ms: В памяти объект 2</text>
  
  <rect x="315" y="205" width="250" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="225" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">...</text>
  
  <rect x="315" y="240" width="250" height="30" rx="2" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="260" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">10ms: В памяти объект 10</text>
  
  <!-- Copy -->
  <rect x="315" y="275" width="250" height="25" rx="2" fill="#007bff" stroke="#0056b3" stroke-width="1"/>
  <text x="440" y="292" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">⚡ ОДНО КОПИРОВАНИЕ буфера</text>
  
  <!-- Result -->
  <rect x="315" y="305" width="250" height="40" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="440" y="325" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#28a745" text-anchor="middle">РЕЗУЛЬТАТ:</text>
  <text x="440" y="339" font-family="Arial, sans-serif" font-size="9" fill="#28a745" text-anchor="middle">Плавная анимация! ✅</text>
</svg>