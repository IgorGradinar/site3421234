<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="300" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Сравнение методов Invalidate</text>
  
  <!-- Main Box -->
  <rect x="25" y="40" width="550" height="240" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="25" y="40" width="550" height="35" rx="8" fill="#0078d4"/>
  <text x="120" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Метод</text>
  <text x="260" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Что перерисовывается</text>
  <text x="420" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Когда использовать</text>
  
  <!-- Row 1 -->
  <rect x="25" y="75" width="550" height="35" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
  <text x="120" y="97" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">this.Invalidate()</text>
  <text x="260" y="97" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" text-anchor="middle">ВСЯ форма (100%)</text>
  <text x="420" y="97" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" text-anchor="middle">Редко - дорого!</text>
  
  <!-- Row 2 -->
  <rect x="25" y="110" width="550" height="35" fill="#f8f9fa" stroke="#ccc" stroke-width="0.5"/>
  <text x="120" y="132" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">this.Invalidate(rect)</text>
  <text x="260" y="132" font-family="Arial, sans-serif" font-size="10" fill="#28a745" text-anchor="middle">Один прямоугольник</text>
  <text x="420" y="132" font-family="Arial, sans-serif" font-size="10" fill="#28a745" text-anchor="middle">Часто используем!</text>
  
  <!-- Row 3 -->
  <rect x="25" y="145" width="550" height="35" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
  <text x="120" y="167" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">this.Invalidate(region)</text>
  <text x="260" y="167" font-family="Arial, sans-serif" font-size="10" fill="#007bff" text-anchor="middle">Сложная область</text>
  <text x="420" y="167" font-family="Arial, sans-serif" font-size="10" fill="#007bff" text-anchor="middle">Для фигур и кривых</text>
  
  <!-- Row 4 -->
  <rect x="25" y="180" width="550" height="35" fill="#f8f9fa" stroke="#ccc" stroke-width="0.5"/>
  <text x="120" y="202" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">e.Graphics.SetClip()</text>
  <text x="260" y="202" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Подмножество</text>
  <text x="420" y="202" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Внутри Paint события</text>
  
  <!-- Note -->
  <rect x="40" y="225" width="520" height="45" rx="4" fill="#cce5ff" stroke="#007bff" stroke-width="1"/>
  <text x="300" y="242" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#004085" text-anchor="middle">💡 Оптимизация производительности:</text>
  <text x="300" y="257" font-family="Arial, sans-serif" font-size="9" fill="#004085" text-anchor="middle">Используйте Invalidate(rect) для перерисовки только измененной области</text>
  <text x="300" y="268" font-family="Arial, sans-serif" font-size="9" fill="#004085" text-anchor="middle">Это значительно ускоряет работу приложения</text>
</svg>