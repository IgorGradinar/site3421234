<svg width="600" height="250" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="250" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">MouseEventArgs: параметры</text>
  
  <!-- Main Box -->
  <rect x="25" y="40" width="550" height="190" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="25" y="40" width="550" height="35" rx="8" fill="#0078d4"/>
  <text x="150" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Параметр</text>
  <text x="320" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Тип</text>
  <text x="470" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Описание</text>
  
  <!-- Row 1 -->
  <rect x="25" y="75" width="550" height="30" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
  <text x="150" y="95" font-family="Arial, sans-serif" font-size="10" fill="#007bff" font-weight="bold" text-anchor="middle">X</text>
  <text x="320" y="95" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">int</text>
  <text x="470" y="95" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Координата X (в px)</text>
  
  <!-- Row 2 -->
  <rect x="25" y="105" width="550" height="30" fill="#f8f9fa" stroke="#ccc" stroke-width="0.5"/>
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="10" fill="#007bff" font-weight="bold" text-anchor="middle">Y</text>
  <text x="320" y="125" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">int</text>
  <text x="470" y="125" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Координата Y (в px)</text>
  
  <!-- Row 3 -->
  <rect x="25" y="135" width="550" height="30" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="10" fill="#007bff" font-weight="bold" text-anchor="middle">Button</text>
  <text x="320" y="155" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Enum</text>
  <text x="470" y="155" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Left, Right, Middle</text>
  
  <!-- Row 4 -->
  <rect x="25" y="165" width="550" height="30" fill="#f8f9fa" stroke="#ccc" stroke-width="0.5"/>
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="10" fill="#007bff" font-weight="bold" text-anchor="middle">Clicks</text>
  <text x="320" y="185" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">int</text>
  <text x="470" y="185" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">1=одиночный, 2=двойной</text>
  
  <!-- Row 5 -->
  <rect x="25" y="195" width="550" height="30" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
  <text x="150" y="215" font-family="Arial, sans-serif" font-size="10" fill="#007bff" font-weight="bold" text-anchor="middle">Delta</text>
  <text x="320" y="215" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">int</text>
  <text x="470" y="215" font-family="Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">+120=вверх, -120=вниз</text>
</svg>